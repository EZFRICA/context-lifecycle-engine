[project]
name = "cle"
version = "0.1.0"
description = "Context Lifecycle Engine - reference implementation of the Agent OS series (parts 7-8)."
requires-python = ">=3.12"
# Apache-2.0 rather than MIT: this is a reference implementation published
# beside articles, so it is meant to be read and copied, and the explicit patent
# grant is what MIT does not give a reader who vendors it into an agent
# platform. The corpora it measures are NOT under this licence - see NOTICE.
# SPDX expression (PEP 639), not `{ file = ... }`: the table form inlines the
# whole licence text into the metadata's License field, which is deprecated and
# unreadable by tooling.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "EZFRICA" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "langchain-google-genai>=4.2.7",
    "langchain-ollama>=1.1.0",
    "python-dotenv>=1.2.2",
    # Real embedding substrate for detection (Embedder Protocol). Used ONLY by
    # the offline cache generator (examples/make_vectors.py); CI reads the
    # committed vectors through CachedEmbedder and never imports the SDK.
    "google-genai>=2.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    # PyYAML ships no type information; without its stubs a checker sees every
    # `yaml` call in the 14 modules that use it as untyped.
    "types-PyYAML>=6.0",
]

# R36 task 1.e. Three groups of imports were undeclared. They are split by who
# needs them, not merged into the core list, because the core list is what a
# reader installs to run the engine and every line added there is a claim that
# the engine needs it.
#
#   dashboard - `cle dashboard` (cle/cli/main.py:451) imports uvicorn, and the
#     FastAPI backend imports fastapi. Undeclared, so `pip install -e .` gave a
#     CLE whose dashboard command crashed on import.
#   measure - the exploratory scripts under examples/bigquery/. Every figure
#     the README publishes carries the command that reproduces it, and a command
#     whose dependencies are not installable is not a reproduction. That is the
#     whole reason this group exists rather than a line in the README saying
#     "install pandas first".
#
# NOT added: `sentence_transformers` and `datasets` pull torch and a model
# download. They belong to `model_bench.py` (R29) alone, whose verdict R35
# invalidated anyway; the script names its own requirement in its docstring.
dashboard = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
measure = [
    "google-cloud-bigquery>=3.25",
    # `job.result().to_dataframe()` raises without it, which is what every bench
    # here calls; undeclared, the reproduction commands died on a fresh venv.
    "db-dtypes>=1.3",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "numpy>=1.26",
]
#   notebook - `tools/clustering_notebook.py`, the marimo notebook over level 1
#     clustering. Declared for the same reason as `measure`: a notebook whose
#     dependencies are not installable is a notebook nobody opens. It needs
#     `measure` too (pandas and numpy do the projection), which is why the
#     README gives `--extra measure --extra notebook` together.
#
# NOT added here: `onnxruntime` and `tokenizers`. They belong to
# `examples/onnx_embedding_bench.py` alone - and to the notebook only when its
# optional ONNX space is selected - so they stay named in those files' docstrings
# rather than installed for every reader. Same rule as `sentence_transformers`
# above, and the reason is the same: a dependency line is a claim the engine
# needs it.
notebook = [
    "marimo>=0.9",
    "altair>=5.4",
]
#   onnx - `--embedder onnx`, the local EmbeddingGemma space. DECLARED, unlike
#     the bench's own imports, because `cle/detect/embedders.py` imports these
#     two and `cle/` declares everything it imports - that is the rule the
#     pyrefly block below keeps strict for the engine. The 622 MB of weights are
#     NOT a dependency: they stay outside the repository, named by
#     $CLE_ONNX_MODEL_DIR.
onnx = [
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
]

[project.scripts]
cle = "cle.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cle"]

[tool.pytest.ini_options]
# Tests import the package from the source tree; no install step required in CI.
#
# `examples/bigquery` is deliberately NOT here, though it is a real import root
# (see `tool.ty.environment` below). Putting it on pytest's path makes
# `bqconfig` importable during a test session, and `bqconfig` calls
# `load_dotenv()` at module scope: importing it would repopulate
# `CLE_FORCE_REAL_MODEL` and `GEMINI_API_KEY` from `.env`, undoing the isolation
# `tests/conftest.py` installs and turning the suite intermittently red. No test
# imports it, so the path buys nothing and costs that.
pythonpath = [".", "examples"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "stub_only: bucket 3 of docs/TESTING.md - the assertion holds ONLY in stub:hashed64 and pins the v1 mechanism, not the production system. Checked by tools/buckets.py.",
]

# The repository has FOUR first-party import roots, not one:
#
#   .                   the `cle` and `dashboard` packages
#   examples            `phrasing`, `gdg_demo`, `make_gdg_fixture`, `make_multiuser`
#   examples/bigquery   `bqconfig`, `make_facets`
#   dashboard_level_2   `discover_intents`, `export_real`, `build`
#
# The last three work at runtime by accident of how the code is entered: pytest
# injects `examples` via `pythonpath`, and `uv run python examples/bigquery/foo.py`
# puts that script's own directory on `sys.path` as a side effect of being run
# directly. Neither is visible to anything that reads the project rather than
# running it, so a type checker reports `bqconfig` and friends as missing while
# the tests pass and the scripts work.
#
# Declared HERE and not in `pythonpath` on purpose: a type checker reading the
# layout needs the roots, a test session importing from them does not, and the
# note above says what that import would cost.
[tool.pyrefly]
search-path = ["examples", "examples/bigquery", "dashboard_level_2"]

[tool.pyright]
extraPaths = ["examples", "examples/bigquery", "dashboard_level_2"]

[tool.ty.environment]
extra-paths = ["examples", "examples/bigquery", "dashboard_level_2"]

# `examples/` is exploratory tooling, not the engine, and it is typed like it:
# pandas frames, heterogeneous dicts, BigQuery job objects whose stubs declare
# `int | None` for fields that are populated once `.result()` has returned. A
# checker reads all of that as errors. Every one of the diagnostics these rules
# silence was triaged and none of them fails at runtime, which the artifacts on
# disk demonstrate: these scripts produced the corpora the published figures
# rest on.
#
# Silenced BY KIND rather than by excluding the directory, so a NEW kind of
# diagnostic still surfaces here instead of the whole tree going dark.
#
# What still protects this directory:
#   - `tests/property/test_scripts_resolve.py` fails CI on any module-level name
#     that is read without being bound, which is the class that actually bit
#     (`space_identity.py` calling `bqconfig.project()` with no import). It is
#     stricter than the checker here: it resolves module-level `for` and `try`
#     bindings that the checker reports as possibly-unbound.
#   - `cle/` and `dashboard/` are NOT covered by this block and stay strict.
[[tool.pyrefly.sub-config]]
matches = "examples/**"

[tool.pyrefly.sub-config.errors]
bad-argument-type = false
bad-index = false
bad-assignment = false
missing-attribute = false
no-matching-overload = false
not-iterable = false
unbound-name = false
unsupported-operation = false
# `int((frame.col == x).sum())` is a numpy.int64 at runtime, which json.dumps
# refuses; the pandas stubs type it `int`, so the checker calls the conversion
# unnecessary.
unnecessary-type-conversion = false
# Scripts here deliberately import packages this project does NOT declare -
# `huggingface_hub`, `datasets`, `sentence_transformers`, `onnxruntime`,
# `tokenizers` - each named in its own module docstring instead, because a
# declared dependency is a claim the engine needs it (see the dependency block
# above). The checker is therefore right and the policy is deliberate, so the
# kind is silenced HERE rather than per import: with the packages absent it
# reported six of these, and a diagnostic whose answer is always "yes, on
# purpose" trains a reader to skim the list. `cle/` and `dashboard/` stay
# strict, and they declare everything they import.
missing-import = false

# `tests/` and `tools/` deliberately pass the wrong types: that is what a
# negative test IS. `test_pre_evidence_not_evidence` hands a `PreEvidence` to a
# parameter typed `Evidence` precisely to prove the boundary refuses it, and the
# closed-vocabulary test hands it free prose where a `Literal` is declared. A
# checker cannot tell a test that violates a contract on purpose from code that
# violates it by accident, so these kinds are off here and stay on in `cle/`.
[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
bad-argument-type = false
bad-assignment = false
bad-specialization = false
missing-argument = false
missing-attribute = false
no-matching-overload = false
unsupported-operation = false

[[tool.pyrefly.sub-config]]
matches = "tools/**"

[tool.pyrefly.sub-config.errors]
bad-argument-type = false
bad-assignment = false
missing-attribute = false
unsupported-operation = false
