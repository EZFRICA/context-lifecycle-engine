name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# This workflow reads the repository and reports a status; it publishes nothing
# and needs no token beyond that. Declared here, so a step added later starts
# with read-only credentials rather than the default write ones.
permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      # Every action is pinned to a COMMIT, not to a tag. A tag is mutable: the
      # owner of any of these three repositories, or anyone who takes one over,
      # can move `v4` to different code and it runs here on the next push, with
      # this checkout in its working directory. The comment says which version
      # the commit is, because a bare hash is unreviewable.
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # The suite uses deterministic stub fingerprinters internally - no real
      # model, no API key, no network.
      - name: Run pytest
        run: uv run pytest

      # The three test buckets of docs/TESTING.md are MEASURED, not counted by
      # hand: the suite runs again with a probe recording which embedder each
      # test invokes, and the documented numbers and every module's SCOPE header
      # must agree with what it recorded.
      - name: Test buckets match the measurement
        run: uv run python tools/buckets.py --check

      # Smoke-test the whole lifecycle loop OFFLINE with fictional (stub)
      # substrates, so CI never calls a real model. Real Gemini is used only
      # for local runs (see examples/full_loop.sh).
      - name: Full-loop smoke (offline, stub models)
        env:
          CLE_MODEL_A: stub-model-a
          CLE_MODEL_B: stub-model-b
        run: bash examples/full_loop.sh
